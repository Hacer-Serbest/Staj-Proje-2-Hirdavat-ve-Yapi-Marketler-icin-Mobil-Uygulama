databases:
  - name: hirdavat-db
    plan: free
    databaseName: hirdavat
    user: hirdavat

services:
  - type: web
    name: hirdavat-api
    runtime: docker
    plan: free
    rootDir: hirdavat-api
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/docs/
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: ALLOWED_HOSTS
        value: hirdavat-api.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://staj-proje-2-hirdavat-ve-yapi-marke.vercel.app
      - key: SECURE_SSL_REDIRECT
        value: "True"
      - key: GUNICORN_WORKERS
        value: "2"
      - key: DATABASE_URL
        fromDatabase:
          name: hirdavat-db
          property: connectionString
